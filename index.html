<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<title>Premium OTT</title>
<link rel="stylesheet" href="style.css">
</head>
<body>

<header>
  <h1>KN OTT</h1>
  <button id="logoutBtn" onclick="logout()">Logout</button>
</header>

<div id="authBox" class="container">
  <h2 id="formTitle">Login</h2>

  <form id="loginForm">
    <input type="text" id="loginUsername" placeholder="Username" required><br>
    <input type="password" id="loginPassword" placeholder="Password" required><br>
    <button type="submit">Login</button>
  </form>

  <form id="signupForm" style="display:none;">
    <input type="text" id="signupUsername" placeholder="Username" required><br>
    <input type="password" id="signupPassword" placeholder="Password" required><br>
    <button type="submit">Signup</button>
  </form>

  <p id="toggle">Don’t have an account? <a onclick="toggleForm()">Signup</a></p>
</div>

<div id="dashboard" style="display:none;">
  <div class="home-options">
    <button onclick="showUploadForm('movie')">Upload Movie</button>
    <button onclick="showUploadForm('webseries')">Upload Web Series</button>
  </div>

  <input type="text" id="searchInput" placeholder="Search by title or category" oninput="searchContent()" style="width:95%; margin:10px auto; display:block; padding:8px; border-radius:5px; border:none; background:#333; color:#fff;">

  <div id="adminPanel" style="display:none;">
    <h2>Admin Panel</h2>

    <form id="movieForm" style="display:none;">
      <input type="text" id="movieTitle" placeholder="Movie Title" required><br>
      <select id="movieCategory" required>
        <option value="">Select Category</option>
        <option>Action</option>
        <option>Drama</option>
        <option>Comedy</option>
        <option>Horror</option>
        <option>Thriller</option>
      </select><br>
      <input type="file" id="moviePoster" accept="image/*" required><br>
      <input type="file" id="movieFile" accept="video/mp4,video/x-matroska" required><br>
      <button type="submit">Add Movie</button>
    </form>

    <form id="webseriesForm" style="display:none;">
      <input type="text" id="wsTitle" placeholder="Web Series Title" required><br>
      <select id="wsCategory" required>
        <option value="">Select Category</option>
        <option>Action</option>
        <option>Drama</option>
        <option>Comedy</option>
        <option>Horror</option>
        <option>Thriller</option>
      </select><br>
      <input type="file" id="wsBanner" accept="image/*" required><br>
      <select id="wsEpisodesCount" onchange="generateEpisodes()" required>
        <option value="">Select number of episodes</option>
        ${[...Array(20).keys()].map(i=>`<option>${i+1}</option>`).join('')}
      </select><br>
      <div id="episodesContainer"></div>
      <button type="submit">Add Web Series</button>
    </form>
  </div>

  <div class="movie-grid" id="contentList"></div>
</div>

<div class="popup" id="popupPlayer">
  <div class="popup-content">
    <span class="close" onclick="closePopup()">&times;</span>
    <video controls id="popupVideo"></video>
  </div>
</div>

<script src="script.js"></script>
</body>
</html>
